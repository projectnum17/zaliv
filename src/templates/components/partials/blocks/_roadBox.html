<div class="road-box">
    <div class="road-box__pic">
        <img src="{{ picture }}" alt="Picture">
    </div>
    <div class="road-box__info">
        <h3 class="road-box__title">{{{ title }}}</h3>
        <div class="road-box__deco">
            {{> _wavesDeco}}
        </div>
        <div class="road-box__details">
            <p>{{ text }}</p>
        </div>
    </div>
</div>
